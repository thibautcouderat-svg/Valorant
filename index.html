<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>

*{box-sizing:border-box;margin:0}

h1,h2,h3{letter-spacing:.06em;text-transform:uppercase}

nav a{display:block;padding:12px 14px;margin-bottom:4px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:600;font-size:.9rem;border-left:3px solid transparent;transition:.2s}

section{animation:in .5s both}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:18px 0}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:12px;padding:16px;transition:.25s;position:relative}

.card .v{font-size:1.9rem;font-weight:800;margin-top:6px}
.bar{height:10px;background:#1d1d29;border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red2),var(--red));box-shadow:0 0 12px var(--red);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
button,.btn{background:var(--red);color:#fff;border:0;padding:11px 18px;border-radius:8px;font-weight:700;letter-spacing:.06em;cursor:pointer;text-transform:uppercase;transition:.2s}
button:hover{filter:brightness(1.2);box-shadow:0 0 16px var(--red)}
button.gh{background:var(--card2);border:1px solid var(--bd)}button.gh.on{border-color:var(--red);color:var(--red)}
input,select,textarea{width:100%;background:#0b0b11;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px;font:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--red)}
label{font-size:.75rem;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:12px 0}
ul.l{list-style:none;padding:0}ul.l li{padding:8px 0;border-bottom:1px solid var(--bd);font-size:.92rem}
.good li:before{content:"▲ ";color:var(--ok)}.bad li:before{content:"▼ ";color:var(--red)}
#arena{position:relative;height:380px;background:#08080d;border:1px solid var(--red2);border-radius:12px;overflow:hidden;cursor:crosshair;user-select:none;margin:12px 0;box-shadow:inset 0 0 40px #ff2d4a14}
.tg{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--red) 20% 55%,#fff 57% 62%,var(--red) 64%);box-shadow:0 0 16px var(--red);animation:pop .15s}

.hud{display:flex;gap:18px;flex-wrap:wrap;font-weight:700}.hud span b{color:var(--red)}
pre.res{background:#0b0b11;border-left:3px solid var(--red);padding:14px;font-size:1rem;line-height:1.6;white-space:pre-wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}.ex{display:flex;gap:12px;align-items:flex-start}.ex input{width:auto;margin-top:4px}
.ex.d{opacity:.5;text-decoration:line-through}
canvas{max-height:240px}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:7px;border-bottom:1px solid var(--bd);text-align:left}
@media(max-width:800px){#burger{display:block}nav{transform:translateX(-100%);width:78%}nav.open{transform:none}main{margin-left:0;padding:16px}.st{display:none}}
button{min-height:44px}
.toast{position:fixed;right:16px;bottom:16px;background:var(--card2);border:1px solid var(--red);padding:12px 18px;border-radius:10px;box-shadow:0 0 20px #ff2d4a55;z-index:50;animation:in .3s}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:60;padding:16px}
body.light{--bg:#f2f2f6;--card:#fff;--card2:#f6f6fa;--tx:#14141c;--mu:#555766;--bd:#d0d0dc}
body.light header,body.light nav{background:#fffffff0}body.light #arena,body.light input,body.light select,body.light textarea{background:#fff}
body.noanim *,body.noanim:before{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,body:before{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
details summary{cursor:pointer;color:var(--red);margin-top:8px}.av{font-size:2.4rem}
body.gate header,body.gate nav,body.gate main{display:none}#gate{padding:30px 16px;max-width:1100px;margin:0 auto}main a:not(.btn){color:var(--red)}body{overflow-x:hidden}main{overflow-x:hidden}img,canvas{max-width:100%}
.card{backdrop-filter:blur(6px);background:linear-gradient(160deg,#1a1a26cc,#101016cc);box-shadow:0 8px 30px #0006}
.card:hover{border-color:var(--red);box-shadow:0 0 24px #ff2d4a40,0 8px 30px #0006}
.pri{border-color:var(--red);background:linear-gradient(135deg,#ff2d4a26,#101016cc);box-shadow:0 0 28px #ff2d4a33}
.pri small{color:var(--red)}h2{margin-top:6px}
.ng{font-size:.65rem;letter-spacing:.22em;color:var(--mu);margin:16px 12px 6px}
.new{font-style:normal;font-size:.6rem;background:var(--red);color:#fff;border-radius:6px;padding:1px 5px;margin-left:4px}
nav{overflow-y:auto}nav a span{display:inline-block;width:1.4em}
button{position:relative;overflow:hidden}button:active{transform:scale(.97)}
.rp{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff6;animation:rp .5s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(18);opacity:0}}
#cur{position:fixed;left:0;top:0;width:28px;height:28px;border:1.5px solid var(--red);border-radius:50%;pointer-events:none;z-index:99;box-shadow:0 0 12px #ff2d4a88;transition:background .15s,border-color .15s}
#cur.h{background:#ff2d4a33}body.noanim #cur{display:none}@media(pointer:coarse){#cur{display:none}}
.dl{max-height:90vh;overflow:auto;width:min(760px,100%)}.dl:hover{transform:none}
#addm{min-height:38px;padding:6px 12px;font-size:.8rem}
@media(max-width:800px){#addm span{display:none}#addm{padding:6px 10px}.logo{font-size:1.05rem}#sw{padding:6px 8px!important}.pf{display:none}.dl{padding:12px}.toast{left:12px;right:12px}}
.pav{display:inline-grid;place-items:center;width:64px;height:64px;border:2px solid var(--red);border-radius:50%;background:var(--card2);font-size:2rem;box-shadow:0 0 14px #ff2d4a44}.pav.sm{width:28px;height:28px;font-size:1rem;vertical-align:middle}.chips .av{font-size:1.5rem;padding:6px 12px}input[type=color]{padding:2px;height:42px;cursor:pointer}</style></head><body>
<header><button id="burger" aria-label="Menu">☰</button><div class="logo">VALO<b>//</b>TRACK</div><div class="sp"></div><div class="st">SYSTÈME EN LIGNE</div><button data-add id="addm" aria-label="Ajouter une partie" title="Ajouter une partie">＋<span> Ajouter une partie</span></button><div class="pf" id="pf"></div><button class="gh" id="sw" aria-label="Changer de profil" style="min-height:36px;padding:6px 12px">⇄ Profils</button></header>
<nav id="nav"></nav><main id="main"></main>
<script>
/* Profils : liste visible par tous, accès par mot de passe (verrou local, stocké dans ce navigateur) */
const GL=(k,d)=>{try{return JSON.parse(localStorage.getItem('vt_'+k))??d}catch(e){return d}},GW=(k,v)=>localStorage.setItem('vt_'+k,JSON.stringify(v));
const gx=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:'';
const gesc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function hpw(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('valotrack:'+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'valotrack:'+t)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}}
(function(){if(GL('profiles',null)===null){const l=[];if(localStorage.getItem('vt_m')!==null){['p','m','a','d','s','sn','mn','demo'].forEach(k=>{const v=localStorage.getItem('vt_'+k);if(v!==null){localStorage.setItem('vt_p0_'+k,v);localStorage.removeItem('vt_'+k)}});const q=JSON.parse(localStorage.getItem('vt_p0_p')||'{}');l.push({id:'p0',name:q.name||'JOUEUR',av:q.avatar||'🎯',pw:''})}GW('profiles',l)}})();
const PL=GL('profiles',[]);let SESS=sessionStorage.getItem('vt_sess');if(!PL.some(x=>x.id===SESS))SESS=null;
const PFX='vt_'+SESS+'_',PROF=PL.find(x=>x.id===SESS)||{};
function enter(id){sessionStorage.setItem('vt_sess',id);location.reload()}
function showGate(){document.body.classList.add('gate');const g=document.createElement('div');g.id='gate';document.body.appendChild(g);
 const draw=()=>{const l=GL('profiles',[]),rk=id=>{try{return JSON.parse(localStorage.getItem('vt_'+id+'_p')).rank||''}catch(e){return ''}};
  g.innerHTML=`<div class="logo" style="font-size:2rem;text-align:center">VALO<b>//</b>TRACK</div><h1 style="text-align:center;margin:12px 0">Choisis ton profil</h1><div class="grid">${l.map(p=>`<div class="card"><span class="pav" style="border-color:${gx(p.fc)}">${p.av||'🎯'}</span><h3 style="color:${gx(p.nc)}">${gesc(p.name)}</h3>${p.title?`<small>${gesc(p.title)}</small><br>`:''}<small>${gesc(rk(p.id))} · ${p.pw?'🔒 Mot de passe requis':'Sans mot de passe'}</small><div style="margin-top:10px"><label for="pw_${p.id}">Mot de passe</label><input id="pw_${p.id}" type="password" ${p.pw?'':'disabled placeholder="Aucun"'}><p id="er_${p.id}" role="alert" style="color:var(--red);min-height:1.3em"></p><button data-in="${p.id}">Entrer</button></div></div>`).join('')||'<p style="text-align:center;color:var(--mu)">Aucun profil pour le moment.</p>'}</div><div class="card" style="max-width:420px;margin:18px auto"><h3>Créer un profil</h3><label for="n_name">Pseudo</label><input id="n_name" maxlength="20"><label for="n_pw">Mot de passe (4 caractères minimum)</label><input id="n_pw" type="password"><p id="n_er" role="alert" style="color:var(--red);min-height:1.3em"></p><button id="n_go">Créer et entrer</button></div>`;
  g.querySelectorAll('[data-in]').forEach(b=>b.onclick=async()=>{const p=l.find(x=>x.id===b.dataset.in);if(p.pw&&await hpw(g.querySelector('#pw_'+p.id).value)!==p.pw){g.querySelector('#er_'+p.id).textContent='Mot de passe incorrect.';return}enter(p.id)});
  g.querySelector('#n_go').onclick=async()=>{const nm=g.querySelector('#n_name').value.trim(),pw=g.querySelector('#n_pw').value,er=g.querySelector('#n_er');
   if(!nm)return er.textContent='Saisis un pseudo.';
   if(l.some(x=>x.name.toLowerCase()===nm.toLowerCase()))return er.textContent='Ce pseudo existe déjà.';
   if(pw.length<4)return er.textContent='Mot de passe trop court (4 caractères minimum).';
   const id='p'+Date.now().toString(36),pre='vt_'+id+'_';l.push({id,name:nm,av:'🎯',pw:await hpw(pw)});GW('profiles',l);
   localStorage.setItem(pre+'p',JSON.stringify({rank:'Iron 1',best:'Iron 1',goal:'Bronze 1',kd:0,wr:0,hs:0,acs:0,games:0,agent:'Jett',name:nm,avatar:'🎯'}));
   localStorage.setItem(pre+'m','[]');localStorage.setItem(pre+'demo','false');enter(id)}};
 draw()}
if(!SESS)showGate();
</script>
<script>
if(SESS){
const $=s=>document.querySelector(s),
L=(k,d)=>{try{return JSON.parse(localStorage.getItem(PFX+k))??d}catch(e){return d}},
W=(k,v)=>localStorage.setItem(PFX+k,JSON.stringify(v)),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=[];['Iron','Bronze','Silver','Gold','Platinum','Diamond','Ascendant','Immortal'].forEach(n=>[1,2,3].forEach(i=>R.push(n+' '+i)));R.push('Radiant');
const MAPS=['Ascent','Bind','Haven','Split','Icebox','Breeze','Fracture','Pearl','Lotus','Sunset','Abyss'],
AG=['Jett','Reyna','Phoenix','Raze','Neon','Yoru','Iso','Sage','Skye','Killjoy','Cypher','Sova','Fade','Gekko','Breach','Omen','Brimstone','Viper','Astra','Harbor','Clove','Miks','Chamber','Vyse','Tejo','Waylay','Deadlock','Veto','Kay/O'];
let DEMO=L('demo',localStorage.getItem(PFX+'m')===null),P=L('p',{rank:'Platinum 2',best:'Platinum 2',goal:'Diamond 1',kd:1.18,wr:57,hs:24,acs:238,games:0,agent:'Jett'}),
M=L('m',demo()),A=L('a',{best:{},prec:0,rt:0,hist:[]}),D=L('d',{}),SES=L('s',null),charts=[],G=null,tm=null;P.name=P.name||PROF.name||'JOUEUR';if(DEMO&&localStorage.getItem(PFX+'m')===null){W('m',M);W('demo',true)}
const avg=(a,k)=>a.length?a.reduce((s,x)=>s+ +x[k],0)/a.length:0;
const N=[['dash','Dashboard'],['aim','Aim Trainer'],['stats','Mes statistiques'],['analyse','Analyse'],['coach','Coach'],['maps','Maps'],['agents','Agents'],['sens','Sensibilité'],['train','Entraînement'],['prof','Profil'],['cfg','Paramètres']];
$('#nav').innerHTML=N.map(n=>`<a href="#${n[0]}" data-v="${n[0]}">${n[1]}</a>`).join('');
$('#sw').onclick=()=>{sessionStorage.removeItem('vt_sess');location.reload()};
$('#burger').onclick=()=>$('#nav').classList.toggle('open');
const opts=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
function count(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,d=+e.dataset.d||0,s=e.dataset.s||'',t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);e.textContent=(n*(1-Math.pow(1-p,3))).toFixed(d)+s;if(p<1)requestAnimationFrame(f)})(t0)});setTimeout(()=>document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'),60)}
const bar=w=>`<div class="bar"><i data-w="${Math.max(0,Math.min(100,w)).toFixed(0)}"></i></div>`;
function advice(p,m){const g=[],b=[];
 p.hs>=20?g.push('Excellent HS% ('+p.hs+' %) : ton aim est précis.'):p.hs<15?b.push('Travaille ton placement de crosshair.'):b.push('Vise la tête de façon constante : objectif 20 % de HS.');
 p.kd>=1.1?g.push('K/D solide ('+p.kd+') : tu gagnes tes duels.'):p.kd<1?b.push('Travaille ton positionnement et évite les duels inutiles.'):b.push('Ton K/D est correct : cherche des duels en ta faveur.');
 p.wr>=55?g.push('Winrate de '+p.wr+' % : tu es régulier.'):p.wr<50?b.push('Analyse tes rounds perdus et ton impact en milieu de partie.'):b.push('Winrate moyen : communique plus et joue les trades.');
 p.acs>=230?g.push('ACS élevé ('+p.acs+') : fort impact en match.'):p.acs<180&&b.push('ACS faible : cherche plus d\'impact (entry, trades, assists).');
 if(m.length>=3){const by=(k)=>{const o={};m.forEach(x=>{(o[x[k]]=o[x[k]]||[]).push(x)});return Object.entries(o).filter(e=>e[1].length>=2).map(e=>[e[0],e[1].filter(x=>x.win).length/e[1].length*100,e[1].length])};
  const am=by('agent').sort((a,b)=>b[1]-a[1]),mp=by('map').sort((a,b)=>b[1]-a[1]);
  if(am.length)g.push('Meilleur agent : '+am[0][0]+' ('+am[0][1].toFixed(0)+' % de victoires).');
  if(am.length>1&&am.at(-1)[1]<45)b.push('Agent à retravailler : '+am.at(-1)[0]+' ('+am.at(-1)[1].toFixed(0)+' %).');
  if(mp.length>1&&mp.at(-1)[1]<45)b.push('Map à éviter ou étudier : '+mp.at(-1)[0]+' ('+mp.at(-1)[1].toFixed(0)+' %).');
  if(avg(m,'d')>avg(m,'k')+3)b.push('Beaucoup de deaths : joue plus safe sur les premiers contacts.')}
 return{g,b}}
function head(t,s){return `<h1>${t}</h1>${s?`<p style="color:var(--mu);margin-top:6px">${s}</p>`:''}`}
function viewDash(){const a=advice(P,M),ci=R.indexOf(P.rank),gi=R.indexOf(P.goal),pr=gi<=0?100:(ci+1)/(gi+1)*100;
 const c=(l,v,x)=>`<div class="card"><small>${l}</small><div class="v">${x||v}</div></div>`,n=(l,v,d,s)=>c(l,0,`<span data-n="${v}" data-d="${d}" data-s="${s||''}">0</span>`);
 return head('Bienvenue sur VALO//TRACK','Ton espace personnel pour analyser, t\'entraîner et progresser sur Valorant.')+
 `<div class="grid">${c('Rang actuel',P.rank)}${c('Meilleur rang',P.best)}${n('K/D',P.kd,2)}${n('Winrate',P.wr,0,' %')}${n('HS %',P.hs,0,' %')}${n('ACS moyen',P.acs,0)}${n('Parties jouées',P.games,0)}${c('Agent principal',P.agent)}</div>
 <div class="card"><h3>Progression vers ton objectif</h3><p style="font-size:1.4rem;margin-top:8px">${P.rank} <b style="color:var(--red)">→</b> ${P.goal}</p>${bar(pr)}<small>${pr.toFixed(0)} % du chemin parcouru</small></div>
 <div class="grid g2"><div class="card"><h3>Tes points forts</h3><ul class="l good">${(a.g.length?a.g:['Joue quelques parties pour révéler tes points forts.']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
 <div class="card"><h3>À améliorer</h3><ul class="l bad">${(a.b.length?a.b:['Aucun point faible détecté : continue ainsi !']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
 <div class="card"><h3>Modifier mon profil</h3><div class="f">
 <div><label>Rang actuel</label><select id="p_rank">${opts(R,P.rank)}</select></div><div><label>Meilleur rang</label><select id="p_best">${opts(R,P.best)}</select></div><div><label>Objectif</label><select id="p_goal">${opts(R,P.goal)}</select></div>
 <div><label>K/D</label><input id="p_kd" type="number" step="0.01" value="${P.kd}"></div><div><label>Winrate %</label><input id="p_wr" type="number" value="${P.wr}"></div><div><label>HS %</label><input id="p_hs" type="number" value="${P.hs}"></div>
 <div><label>ACS</label><input id="p_acs" type="number" value="${P.acs}"></div><div><label>Parties</label><input id="p_games" type="number" value="${P.games}"></div><div><label>Agent</label><select id="p_agent">${opts(AG,P.agent)}</select></div></div>
 <button id="psave">Enregistrer</button> <button class="gh" id="psync">Utiliser mes parties saisies</button></div>`}
function bindDash(){$('#psave').onclick=()=>{['rank','best','goal','agent'].forEach(k=>P[k]=$('#p_'+k).value);['kd','wr','hs','acs','games'].forEach(k=>P[k]=+$('#p_'+k).value||0);W('p',P);go('dash')};
 $('#psync').onclick=()=>{if(!M.length)return alert('Ajoute d\'abord au moins une partie dans « Mes statistiques ».');const d=avg(M,'d')||1;P.kd=+(avg(M,'k')/d).toFixed(2);P.wr=Math.round(M.filter(x=>x.win).length/M.length*100);P.hs=Math.round(avg(M,'hs'));P.acs=Math.round(avg(M,'acs'));P.games=M.length;W('p',P);go('dash')}}
/* ---------- AIM ---------- */
const MODES={30:['30 secondes',1200,44],60:['60 secondes',1200,44],prec:['Précision',700,28],reac:['Réaction',1500,50]};
